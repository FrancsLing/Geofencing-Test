<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <title>Am I nearby?</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17312a; background: #f4f7f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 36px; border: 1px solid #dce6dc; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px #23483212; }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: #e9f5e9; color: #287348; font-size: 24px; }
    h1 { margin: 22px 0 8px; font-size: clamp(28px, 7vw, 36px); letter-spacing: -.04em; }
    .intro { margin: 0; color: #64756c; line-height: 1.55; }
    .target { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 26px 0; padding: 16px; border-radius: 14px; background: #f5f8f4; font-size: 13px; color: #64756c; }
    .target strong { color: #27483a; font-weight: 600; text-align: right; }
    button { width: 100%; border: 0; border-radius: 14px; padding: 15px 18px; background: #237447; color: white; font: inherit; font-weight: 650; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover { background: #195f39; } button:active { transform: scale(.99); } button:disabled { opacity: .65; cursor: wait; }
    #result { min-height: 75px; margin-top: 20px; padding: 16px; border-radius: 14px; background: #f5f8f4; color: #64756c; line-height: 1.5; }
    #result strong { display: block; margin-bottom: 3px; color: #27483a; font-size: 17px; }
    #result.near { background: #e9f5e9; color: #34744b; } #result.near strong { color: #176737; }
    #result.far { background: #fff4e7; color: #8a6330; } #result.far strong { color: #85551b; }
    .note { margin: 18px 0 0; color: #8a9890; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌖</div>
    <h1>Am I nearby?</h1>
    <p class="intro">Check whether you’re within 30 meters of the pinned location.</p>
    <div class="target"><span>Target location</span><strong>10.7207889, 123.8170935</strong></div>
    <button id="check" type="button">Check my location</button>
    <div id="result" role="status" aria-live="polite">Your result will appear here.</div>
    <p class="note">Location access is used only for this check. Allow it when prompted.</p>
  </main>
  <script>
    const TARGET = { lat: 10.720788860167113, lon: 123.81709348927583 };
    const RADIUS_METERS = 30;
    const button = document.querySelector('#check');
    const result = document.querySelector('#result');

    function distanceMeters(a, b) {
      const radians = value => value * Math.PI / 180;
      const dLat = radians(b.lat - a.lat);
      const dLon = radians(b.lon - a.lon);
      const lat1 = radians(a.lat);
      const lat2 = radians(b.lat);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    button.addEventListener('click', () => {
      result.className = '';
      if (!('geolocation' in navigator)) {
        result.innerHTML = '<strong>Location unavailable</strong>This browser does not support location checks.';
        return;
      }
      button.disabled = true;
      button.textContent = 'Checking…';
      result.textContent = 'Waiting for your location…';
      navigator.geolocation.getCurrentPosition(({ coords }) => {
        const distance = distanceMeters({ lat: coords.latitude, lon: coords.longitude }, TARGET);
        const rounded = Math.round(distance);
        const inside = distance <= RADIUS_METERS;
        result.className = inside ? 'near' : 'far';
        result.innerHTML = inside
          ? `<strong>You’re within the radius ✓</strong>You are about ${rounded} m from the target.`
          : `<strong>You’re outside the radius</strong>You are about ${rounded} m away; the limit is 30 m.`;
        button.disabled = false;
        button.textContent = 'Check again';
      }, error => {
        const message = error.code === 1 ? 'Allow location access in your browser, then try again.'
          : error.code === 2 ? 'Your device could not determine its location. Try again somewhere with a clearer signal.'
          : 'Location took too long. Please try again.';
        result.innerHTML = `<strong>Couldn’t check location</strong>${message}`;
        button.disabled = false;
        button.textContent = 'Try again';
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  </script>
</body>
</html>
